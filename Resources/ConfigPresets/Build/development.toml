[game]
# Tutorial: TutorialServer is the local default (was lobbyenabled=false + Dev/Sandbox).
# Dev map only exposes Captain latejoin slots — that masked wrong-preset launches.
lobbyenabled = true
map = "TutorialLobby"
defaultpreset = "TutorialServer"
fallbackpreset = "TutorialServer"
role_timers = false
admin_job_tracking = true
role_loadout_timers = false
# Keep Passenger + Captain for any leftover Dev-map workflows.
new_character_jobs = "Passenger, Captain"
soft_max_players = 40

[events]
enabled = false

[ghost]
role_time = 0.5
quick_lottery = true

[movement]
mob_pushing = true

[physics]
# Makes mapping annoying
grid_splitting = false

[procgen]
preload = false

[salvage]
expedition_cooldown = 30.0

[shuttle]
grid_fill = false
auto_call_time = 0
emergency = false
arrivals = false
preload_grids = false

[afk]
time = 0

#Tutorial: TutorialServer connect-time rules popup (localhost is still exempt)
[rules]
enabled = true
time = 5
validity_days = 0

[server]
rules_file = "TutorialServerRules"

[admin]
afk_time = 0
see_own_notes = true
new_player_threshold = 120

[ic]
random_characters = true
random_species_weights = ""
ssd_sleep_time = 3600

[database]
# Change to postgres if needed
engine = "sqlite"
pg_host = "localhost"
pg_port = 5432
pg_database = "ss14"
pg_username = "postgres"
pg_password = "postgres"

[net]
max_rapid_connections = 413
max_ip_connections = 413

#Tutorial: TutorialServer — no player OOC (enable_during_round blocks end-of-round auto-enable)
[ooc]
enabled = false
enable_during_round = true

[looc]
enabled = false

[dead_chat]
enabled = false

#Tutorial: development keeps unfinished tutorials visible (stub-prefixed)
[tutorial]
live_tutorials = false
