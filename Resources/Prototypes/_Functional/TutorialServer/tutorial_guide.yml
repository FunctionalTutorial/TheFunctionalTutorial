- type: entity
  parent: BaseItem
  id: TutorialGuide
  name: Urist McPositronic
  description: A chatty positronic coach for off-grid tutorials. Activate it to open your checklist. It speaks your current tip aloud.
  components:
  - type: Sprite
    sprite: Objects/Devices/tablets.rsi
    layers:
    - state: tablet
    - state: generic
      shader: unshaded
  - type: Item
    size: Small
    sprite: Objects/Devices/tablets.rsi
  - type: TutorialGuide
  - type: ActivatableUI
    key: enum.TutorialPromptUiKey.Key
    inHandsOnly: true
    singleUser: true
    requireActiveHand: true
  - type: UserInterface
    interfaces:
      enum.TutorialPromptUiKey.Key:
        type: TutorialPromptBoundUserInterface

# Action bar button to open the role picker (granted on tutorial spawn and ghosts).
- type: entity
  parent: BaseMentalAction
  id: ActionTutorialChooseRole
  name: Choose a tutorial
  description: Open the Tutorial Server role picker. Click the dollar sign at the top or side of the game window.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    layers:
    - texture: Interface/Actions/shop.png
  - type: InstantAction
    event: !type:TutorialChooseRoleActionEvent
