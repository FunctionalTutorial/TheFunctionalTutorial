# Sample configuration for The Functional Tutorial Server.
# Copy values into your instance server_config.toml / secrets as appropriate.

[game]
hostname = "The Functional Tutorial Server"
defaultpreset = "TutorialServer"

[chat]
motd = "Press Join in the lobby, then pick a job (Passenger is first for the basics). Type /ghost and respawn or use Choose a tutorial to try another."
# ooc.enabled / looc.enabled are also forced off by the TutorialServer rule at runtime.

[shuttle]
# Lobby has no StationEmergencyShuttle. TutorialServerRule also forces this to 0 at runtime.
auto_call_time = 0

[server]
rules_file = "TutorialServerRules"
uptime_restart_minutes = 1440

[rules]
# Connect-time rules acceptance popup. Admins can still use showrules.
enabled = false
